# 发版走 CI：由这里统一包版本、写 CHANGELOG、打 tag、推 main 并建 Release。
# 顺序固定：发版提交直接接在 main tip 上 → 构建打包 → 原子推送 tag 与 main → 最后建 Release。
# 任何一步失败都不会留下一个 main 里不存在的正式 Release。
# 官网由本仓库 web-deploy.yml 部署，主机与密钥仅在 Actions secrets。
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 执行发版的起点；必须是 main 的历史（作业随后 fast-forward 到 main 当前 tip）
        required: false
        default: main
        type: string
      version:
        description: 显式版本号 0.<minor>.<YYMMDDNN>，留空按当天序号递增
        required: false
        default: ""
        type: string
      require_ci:
        description: 发版前等待该 commit 的 CI 全部成功（默认不等：先发版，CI 异步跑，见 AGENTS.md「发版与测试」）
        required: false
        default: false
        type: boolean
      expected_sha:
        description: 自动发版锁定的已验证提交；main 已变化则拒绝发版
        required: false
        default: ""
        type: string
      android_only:
        description: 只发布 Android；不发布 iOS、桌面或 Web，也不替换 GitHub 的全平台 Latest
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  checks: read
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, CHANGELOG and GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # 发版点只能是 main 上的提交。从分叉分支发版会让发版提交带着整条分支历史 rebase 进 main，
      # 冲突后留下的就是「Release 已建、main 没有」的孤儿版本；这里提前拒绝，不给任何副作用。
      # 比较的是提交对象：ref=main 时 HEAD 是分支名，--is-ancestor 拿它当提交查会失败。
      - name: ref 必须是 main 的历史
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "::error::$INPUT_REF 不在 origin/main 的历史里；先把它合进 main 再发版"
            exit 1
          fi
        env:
          INPUT_REF: ${{ inputs.ref || 'main' }}
      # 发版提交直接落在 origin/main 当前 tip 上，之后到 main 的推送必然是快进，不会冲突。
      - name: 对齐到最新 main
        run: |
          if [ -n "$EXPECTED_SHA" ]; then
            node --input-type=module -e "
              const [expected, actual] = process.argv.slice(1);
              if (!/^[0-9a-f]{40}$/.test(expected) || expected !== actual) {
                console.error('main 已变化或 expected_sha 不合法；等待当前 main 的 CI 后再发版');
                process.exit(1);
              }
            " "$EXPECTED_SHA" "$(git rev-parse origin/main)"
          fi
          git merge --ff-only origin/main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
      - name: 该 commit 的 CI 必须全部成功
        if: ${{ inputs.require_ci || inputs.expected_sha != '' }}
        run: >-
          node scripts/release/ci-status.mjs
          --sha "$(git rev-parse HEAD)" --wait 900
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 同一 commit 不重复发版
        run: node scripts/release/version.mjs --assert-unreleased
      - name: 计算版本
        id: version
        run: |
          set -- --next
          [ -n "$INPUT_VERSION" ] && set -- "$@" --version "$INPUT_VERSION"
          next="$(node scripts/release/version.mjs "$@")"
          echo "version=$next" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - run: npm ci
      - name: 统一所有 workspace 包版本
        run: node scripts/release/bump-versions.mjs --version "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # apps/desktop 不在 npm workspaces 里（它有自己的 Tauri CLI 依赖），版本单独同步。
      - name: 同步桌面壳版本
        run: node scripts/release/sync-desktop-version.mjs --version "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: 写 CHANGELOG 小节
        run: node scripts/release/changelog.mjs --build --version "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: 提交并发版 tag
        run: |
          git config user.name "yonder-release"
          git config user.email "release@yonder.local"
          git add -A
          git commit -m "chore(release): $VERSION"
          git tag "v$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: 版本一致性
        run: node scripts/version-check.mjs --tag "v$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: 构建 Web 产物（发版前确认可构建）
        run: npm run build
      # main 与 tag 一次原子推送：要么都成功，要么都没落地。重试只处理瞬时失败；若 main 在发版期间
      # 被别人推送，推送会一直非快进而失败，此时什么都没有落地（没有 tag、没有 Release），重跑发版即可。
      - name: 推送 tag 与 main
        run: |
          for _ in 1 2 3; do
            git push --atomic origin "HEAD:main" "refs/tags/v$VERSION" && exit 0
            sleep 10
          done
          echo "::error::推送失败。tag 与 main 都没有更新、也没有 Release；确认 main 后重新触发发版"
          exit 1
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # Release 最后创建，而且先建成草稿再公开：正式版一旦公开，releases/latest 与发布 watcher
      # 都会立刻读到它。各平台的安装包由下面派发的工作流随后追加到同一个 Release。
      - name: 创建 GitHub Release（草稿）
        run: |
          node scripts/release/changelog.mjs --body "$VERSION" > release-notes.md
          for _ in 1 2 3; do
            gh release create "v$VERSION" \
              --title "Yonder $VERSION" \
              --notes-file release-notes.md \
              --draft --verify-tag && exit 0
            sleep 15
          done
          echo "::error::草稿 Release 创建失败。tag v$VERSION 与 main 已推送，不要重新发版；修好原因后手工执行 gh release create 补建"
          exit 1
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 公开 Release
        run: |
          if [ "$ANDROID_ONLY" = "true" ]; then
            gh release edit "v$VERSION" --draft=false --latest=false
          else
            gh release edit "v$VERSION" --draft=false --latest
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ANDROID_ONLY: ${{ inputs.android_only }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GITHUB_TOKEN 推送的提交不会再触发 push 事件，发版提交与 tag 因此从来没有跑过 CI。
      # 这里以 tag 为 ref 显式派发一次，让 CI 跑在发布出来的那个提交上；结论在 Actions 里看，
      # 红的话不回滚已发布的版本，修好后再发下一版。
      - name: 在发版提交上派发 CI
        run: gh workflow run ci.yml --ref "v$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 安卓 APK、iOS TestFlight 与桌面安装包在各自的原生 runner 上构建后追加到同一个 Release，
      # 并上传 OSS。GITHUB_TOKEN 创建的 Release 不会触发 release: published，所以和 CI 一样在这里
      # 显式派发；派发后仍未完成的构建只记警告，不回滚已发布的版本。
      - name: 派发安卓 APK、iOS TestFlight 与桌面安装包构建
        continue-on-error: true
        run: |
          sha="$(git rev-parse HEAD)"
          failed=""
          set -- android-release.yml
          if [ "$ANDROID_ONLY" != "true" ]; then
            set -- "$@" desktop-release.yml ios-release.yml
          fi
          for workflow in "$@"; do
            ref="v$VERSION"
            # 签名 runner 只接受 main 上的桌面工作流，实际构建仍锁定版本 tag 的 SHA。
            if [ "$workflow" = desktop-release.yml ]; then ref=main; fi
            if ! gh workflow run "$workflow" --ref "$ref" \
              -f "version=$VERSION" -f "expected_commit=$sha"; then
              failed="$failed $workflow"
            fi
          done
          {
            echo "release=published"
            echo "tag=v$VERSION"
            echo "sha=$sha"
            if [ -z "$failed" ]; then echo "packages=dispatched"; else echo "packages=pending:$failed"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            echo "::warning::Release v$VERSION is public but these builds were not dispatched:$failed. Dispatch desktop-release.yml on main and the other workflows on tag v$VERSION; use the existing release."
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_ONLY: ${{ inputs.android_only }}
      - name: Dispatch official web deployment
        if: ${{ !inputs.android_only }}
        continue-on-error: true
        run: gh workflow run web-deploy.yml --ref "v$VERSION" -f "tag=v$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
