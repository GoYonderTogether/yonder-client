name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --no-warnings

jobs:
  linux:
    name: Linux lint, typecheck, test, checks, web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node tools/check-entry-imports.mjs
      - run: node tools/check-dependency-direction.mjs
      - run: node tools/check-file-length.mjs
      - run: node scripts/release/changelog.mjs --check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  public-pages:
    name: Public browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-artifacts
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  macos-desktop:
    name: macOS desktop shell build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix apps/desktop --no-audit --no-fund
      - working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx --no-install tauri build --bundles app
      - run: |
          set -eu
          app="apps/desktop/src-tauri/target/release/bundle/macos/Yonder.app"
          test -d "$app"
          plist="$app/Contents/Info.plist"
          identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          expected="$(node -p "require('./apps/desktop/package.json').version")"
          test "$identifier" = "dev.yonder.desktop"
          test "$version" = "$expected"
          codesign --verify --deep --strict "$app"

  ci:
    name: CI
    if: ${{ always() }}
    needs: [linux, public-pages, macos-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
