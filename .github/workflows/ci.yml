name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep the active main-push build; only the newest pending push is needed for preview.
  # Manual runs keep their prior cancellation behavior without interrupting the preview.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && '-push' || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  NODE_OPTIONS: --no-warnings

jobs:
  linux:
    name: Linux lint, typecheck, test, checks, web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/miniprogram --no-audit --no-fund
      - run: npm run check:miniprogram
      - run: npm run build:miniprogram
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/agent-land.test.mjs
      - run: node tools/check-entry-imports.mjs
      - run: node tools/check-dependency-direction.mjs
      - run: node tools/check-file-length.mjs
      - run: node tools/check-tailwind-sources.mjs
      - run: node tools/check-ui-raw-values.mjs
      - run: node scripts/release/changelog.mjs --check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}

  public-pages:
    name: Public browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-artifacts
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  macos-desktop:
    name: macOS desktop shell build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix apps/desktop --no-audit --no-fund
      - working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx --no-install tauri build --bundles app
      - run: |
          set -eu
          app="apps/desktop/src-tauri/target/release/bundle/macos/Yonder.app"
          test -d "$app"
          plist="$app/Contents/Info.plist"
          identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          expected="$(node -p "require('./apps/desktop/package.json').version")"
          test "$identifier" = "dev.yonder.desktop"
          test "$version" = "$expected"
          codesign --verify --deep --strict "$app"
      - name: Package the verified macOS app for internal preview
        id: internal-preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.YONDER_PUBLIC_PREVIEW_ARTIFACTS == 'true'
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]]
          app=apps/desktop/src-tauri/target/release/bundle/macos/Yonder.app
          plist="$app/Contents/Info.plist"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          arch="$(lipo -archs "$app/Contents/MacOS/$executable" | tr ' ' '-')"
          name="Yonder-$version-$arch-${GITHUB_SHA:0:12}-macos-ad-hoc"
          out="$RUNNER_TEMP/yonder-internal-preview"
          stage="$(mktemp -d)"
          mount_point="$(mktemp -d)"
          mounted=0
          cleanup() {
            if [[ "$mounted" = "1" ]]; then
              hdiutil detach "$mount_point"
            fi
            rm -rf "$stage" "$mount_point"
          }
          trap cleanup EXIT
          mkdir -p "$out"
          ditto "$app" "$stage/Yonder.app"
          dmg="$out/$name.dmg"
          hdiutil create -srcfolder "$stage" -volname "Yonder Internal Preview" -format UDZO "$dmg"
          hdiutil verify "$dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$dmg"
          mounted=1
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mount_point/Yonder.app/Contents/Info.plist")"
          [[ "$actual" = "$version" ]]
          codesign --verify --deep --strict "$mount_point/Yonder.app"
          codesign -dvv "$mount_point/Yonder.app" 2>&1 | grep -Fx 'Signature=adhoc'
          hdiutil detach "$mount_point"
          mounted=0
          (cd "$out" && shasum -a 256 "$name.dmg" > SHA256SUMS)
          {
            printf 'commit=%s\nversion=%s\narchitecture=%s\n' "$GITHUB_SHA" "$version" "$arch"
            printf 'run=%s\nattempt=%s\nsigning=ad-hoc (not notarized)\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } > "$out/build-info.txt"
          printf 'name=%s-attempt-%s\n' "$name" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload internal preview DMG
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.YONDER_PUBLIC_PREVIEW_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.internal-preview.outputs.name }}
          path: ${{ runner.temp }}/yonder-internal-preview/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  ci:
    name: CI
    if: ${{ always() }}
    needs: [linux, public-pages, macos-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
