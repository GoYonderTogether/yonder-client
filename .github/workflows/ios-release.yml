# iOS 构建与 TestFlight 分发。
#
# 触发方式与 android-release.yml 相同：release.yml 在正式 Release 公开后以发版 tag 显式派发
# （`gh workflow run ios-release.yml --ref v$VERSION -f version=… -f expected_commit=…`）。
# 不依赖 `release: published`：本仓 Release 由 release.yml 用 GITHUB_TOKEN 创建，GITHUB_TOKEN
# 产生的事件不会再触发任何工作流；那个触发器只为手工在网页上公开 Release 的场合保留。
#
# 签名材料全部来自 secrets，构建后立即删除：
#   IOS_DISTRIBUTION_CERT_P12_BASE64  Apple Distribution 证书 + 私钥（p12，导出密码见下）
#   IOS_DISTRIBUTION_CERT_PASSWORD    p12 的导出密码
#   IOS_PROVISIONING_PROFILE_BASE64   App Store 分发 profile（优先用于常规发布，需 production APNs）
#   IOS_TESTFLIGHT_PUSH_PROFILE_BASE64  优先用于内部测试的 App Store profile（带 production APNs）
#   IOS_TEAM_ID                       团队 ID（D4UZU32UN9）
#   ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_PRIVATE_KEY_BASE64
#                                     App Store Connect API Key，用于上传 TestFlight
# 新 App 只允许从 main 手工派发 ios_app=next；签名用 IOS_NEXT_*，上传用 ASC_IOS_NEXT_API_*，不回退旧密钥。
#
# 导出用 xcodebuild -exportArchive 而不是 tauri 的导出步骤：后者生成的 ExportOptions 不带
# provisioningProfiles 映射，实测报 `exportArchive requires a provisioning profile`。
# 上传用 `xcrun altool --upload-app`：同一份 API Key 既导出又上传，不需要 App 专用密码。
# 内测派发先用 `git ls-remote origin refs/heads/main` 确定 SHA，再用
# `gh run list --workflow ci.yml --branch main --event push --commit <SHA>` 核对同提交 CI 成功。
# 对该 SHA 使用 `--ref main -f expected_commit=<SHA> -f testflight_internal=true` 手工派发。
# 外测候选可同样从 main 手工上传，省略 testflight_internal。只有 tag 发布才附加 GitHub Release 资产。
name: iOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 本次发布版本 0.<minor>.<YYMMDDNN>（不带 v）
        required: true
        type: string
      expected_commit:
        description: 发版 tag 应指向的完整 40 位提交 SHA；留空表示在所选 ref 上直接构建（手工验证用，不核对 tag）
        required: false
        default: ""
        type: string
      marketing_version:
        description: 仅手工上传 App Store 候选时指定商店版本（如 1.0.0），构建号仍取 version 的日期序号
        required: false
        default: ""
        type: string
      ios_app:
        description: iOS App 记录（next 为 net.yonderbot.ios）
        default: legacy
        type: choice
        options: [legacy, next]
      testflight_internal:
        description: 仅允许内部 TestFlight 分发
        required: false
        default: false
        type: boolean
      testflight_xcode_27_2:
        description: 临时 Xcode 27.2 对照包（旧 App 0.3.26112608 / 26112692）
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ios-release${{ inputs.ios_app == 'next' && '-next' || '' }}-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  testflight:
    name: iOS TestFlight upload
    runs-on: ${{ inputs.testflight_xcode_27_2 && 'xcode-27' || 'macos-latest' }}
    timeout-minutes: 90
    env:
      BUNDLE_ID: ${{ inputs.ios_app == 'next' && 'net.yonderbot.ios' || 'net.yonderbot.app' }}
      TESTFLIGHT_XCODE_27_2: ${{ inputs.testflight_xcode_27_2 }}
    steps:
      # 手工派发固定到事件的提交，避免 runner 启动前 main 前进而选错源码。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 1

      # 版本只在这里确定：apps/desktop 不在 npm workspaces，bump-versions.mjs 不改它的
      # package.json / tauri.ios.conf.json，所以不从仓库文件读版本。
      - name: 核对 tag → 提交并确定版本
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IOS_APP: ${{ inputs.ios_app }}
          TESTFLIGHT_INTERNAL: ${{ inputs.testflight_internal }}
        run: |
          set -eu
          if [ -n "${RELEASE_TAG:-}" ]; then
            tag="$RELEASE_TAG"
          else
            tag="v${INPUT_VERSION#v}"
          fi
          version="${tag#v}"
          [[ "$version" =~ ^0\.[0-9]+\.[0-9]{8}$ ]] || {
            echo "::error::version must be 0.<minor>.<YYMMDDNN> (got: $version)"
            exit 1
          }
          head_sha="$(git rev-parse HEAD)"
          if [ "${IOS_APP:-legacy}" = next ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ] ||
              [ -z "$EXPECTED_COMMIT" ] || [ "${TESTFLIGHT_INTERNAL:-false}" = true ]; then
              echo "::error::the new iOS app requires a manual App Store eligible dispatch from main with a verified commit SHA"
              exit 1
            fi
          fi
          marketing_version="${INPUT_MARKETING_VERSION:-$version}"
          if [ -n "${INPUT_MARKETING_VERSION:-}" ]; then
            if [ "$GITHUB_REF" != refs/heads/main ] || [ "${TESTFLIGHT_INTERNAL:-false}" = true ] || [ -z "$EXPECTED_COMMIT" ]; then
              echo "::error::marketing_version requires an App Store eligible dispatch from main with a verified commit SHA"
              exit 1
            fi
            [[ "$marketing_version" =~ ^((0|[1-9][0-9]*)\.){2}(0|[1-9][0-9]*)$ ]] || {
              echo "::error::marketing_version must have three numeric parts, such as 1.0.0"
              exit 1
            }
          fi
          if [ "${TESTFLIGHT_INTERNAL:-false}" = true ]; then
            if [ "$GITHUB_REF" != refs/heads/main ] || [ -z "$EXPECTED_COMMIT" ]; then
              echo "::error::internal TestFlight requires main and the verified commit SHA"
              exit 1
            fi
          fi
          if [ "${TESTFLIGHT_XCODE_27_2:-false}" = true ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ] ||
              [ "$BUNDLE_ID" != net.yonderbot.app ] || [ "${TESTFLIGHT_INTERNAL:-false}" = true ] ||
              [ -z "$EXPECTED_COMMIT" ] || [ "$version/$marketing_version" != 0.3.26112692/0.3.26112608 ]; then
              echo "::error::the Xcode 27.2 control requires legacy app 0.3.26112608 (26112692) and a verified manual App Store eligible dispatch from main"
              exit 1
            fi
          fi
          if [ -n "$EXPECTED_COMMIT" ]; then
            [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_commit must be a 40-char SHA"; exit 1; }
            [ "$head_sha" = "$EXPECTED_COMMIT" ] || {
              echo "::error::$tag points at $head_sha, not $EXPECTED_COMMIT"
              exit 1
            }
          fi
          # CFBundleVersion 只接受点分整数；0.3.26110208 → 26110208，与安卓 versionCode 同量纲。
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${version##*.}" >> "$GITHUB_ENV"
          echo "app $BUNDLE_ID, version $version, tag $tag, commit $head_sha"

      - name: 固定对照包的 Xcode 27.2
        if: ${{ inputs.testflight_xcode_27_2 }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        run: |
          set -eu
          arch="$(uname -m)"
          xcode="$(xcodebuild -version)"
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf '%s\n%s\niPhoneOS SDK %s\n' "$arch" "$xcode" "$sdk"
          if [ "$arch" != arm64 ] || [ "$xcode" != "$(printf 'Xcode 27.2\nBuild version 27B52')" ] || [ "$sdk" != 27.2 ]; then
            echo "::error::the control requires arm64, Xcode 27.2 (27B52), and iPhoneOS SDK 27.2"
            exit 1
          fi
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 工具链与 apps/desktop/rust-toolchain.toml 一致；iOS 目标一次装齐。
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.testflight_xcode_27_2 }}
        with:
          workspaces: apps/desktop/src-tauri

      # 根 workspace 提供 apps/web 的构建；apps/desktop 单独装它自己的 Tauri CLI。
      - name: 安装依赖
        env:
          VITE_YONDER_UPDATE_CHANNEL: ${{ inputs.testflight_internal && 'testflight-internal' || '' }}
        run: |
          npm ci
          npm pkg set "version=$MARKETING_VERSION" --workspace @yonder/web
          npm run build
          cd apps/desktop && npm install

      - name: 还原签名材料
        env:
          CERT_BASE64: ${{ secrets[inputs.ios_app == 'next' && 'IOS_NEXT_DISTRIBUTION_CERT_P12_BASE64' || 'IOS_DISTRIBUTION_CERT_P12_BASE64'] }}
          CERT_PASSWORD: ${{ secrets[inputs.ios_app == 'next' && 'IOS_NEXT_DISTRIBUTION_CERT_PASSWORD' || 'IOS_DISTRIBUTION_CERT_PASSWORD'] }}
          PROFILE_BASE64: ${{ secrets[inputs.ios_app == 'next' && 'IOS_NEXT_PROVISIONING_PROFILE_BASE64' || 'IOS_PROVISIONING_PROFILE_BASE64'] }}
          INTERNAL_PUSH_PROFILE_BASE64: ${{ inputs.ios_app != 'next' && secrets.IOS_TESTFLIGHT_PUSH_PROFILE_BASE64 || '' }}
          TEAM_ID: ${{ secrets[inputs.ios_app == 'next' && 'IOS_NEXT_TEAM_ID' || 'IOS_TEAM_ID'] }}
          TESTFLIGHT_INTERNAL: ${{ inputs.testflight_internal }}
        run: |
          set -eu
          [ -n "${CERT_BASE64:-}" ] || { echo "::error::missing distribution certificate for $BUNDLE_ID"; exit 1; }
          [ -n "${CERT_PASSWORD:-}" ] || { echo "::error::missing distribution certificate password for $BUNDLE_ID"; exit 1; }
          [ -n "${TEAM_ID:-}" ] || { echo "::error::missing signing team for $BUNDLE_ID"; exit 1; }
          dir="$RUNNER_TEMP/yonder-signing"
          mkdir -p "$dir" "$HOME/Library/MobileDevice/Provisioning Profiles"
          keychain="$dir/yonder.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          profile_for() {
            [ -n "$1" ] || return 1
            printf '%s' "$1" | base64 --decode > "$dir/yonder.mobileprovision" 2>/dev/null || return 1
            security cms -D -k "$keychain" -i "$dir/yonder.mobileprovision" > "$dir/profile.plist" 2>/dev/null || return 1
            read_profile() { plutil -extract "$1" raw "$dir/profile.plist" 2>/dev/null; }
            [ "$(read_profile Entitlements.application-identifier)" = "$TEAM_ID.$BUNDLE_ID" ] || return 1
            [ "$(read_profile TeamIdentifier.0)" = "$TEAM_ID" ] || return 1
            [ "$(read_profile 'Entitlements.com\.apple\.developer\.team-identifier')" = "$TEAM_ID" ] || return 1
            [ "$(read_profile Entitlements.aps-environment)" = production ] || return 1
            [ "$(read_profile Entitlements.get-task-allow)" = false ] || return 1
            if plutil -extract ProvisionedDevices xml1 -o /dev/null "$dir/profile.plist" 2>/dev/null ||
              [ "$(read_profile ProvisionsAllDevices)" = true ]; then return 1; fi
            expiry="$(date -j -u -f '%Y-%m-%dT%H:%M:%SZ' "$(read_profile ExpirationDate)" +%s 2>/dev/null)" || return 1
            [ "$expiry" -gt "$(date +%s)" ] || return 1
            profile_name="$(read_profile Name)" || return 1
            case "$profile_name" in ""|*'"'*|*'\'*|*[[:cntrl:]]*) return 1 ;; esac
          }
          # TestFlight's audience is an export option, not a provisioning-profile property.
          if [ "${TESTFLIGHT_INTERNAL:-false}" = true ]; then
            primary="${INTERNAL_PUSH_PROFILE_BASE64:-}"; fallback="${PROFILE_BASE64:-}"
          else
            primary="${PROFILE_BASE64:-}"; fallback="${INTERNAL_PUSH_PROFILE_BASE64:-}"
          fi
          profile_for "$primary" || profile_for "$fallback" || {
            echo "::error::expected an unexpired App Store profile with production APNs for this team and $BUNDLE_ID"
            exit 1
          }
          printf '%s' "$CERT_BASE64" | base64 --decode > "$dir/dist.p12"
          # 分区列表不设的话 codesign 报 errSecInternalComponent（本地实测过）。
          security import "$dir/dist.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          cp "$dir/yonder.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$(uuidgen).mobileprovision"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "IOS_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "YONDER_IOS_PUSH=1" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"

      - name: 初始化 iOS 工程并重放图标与签名设置
        run: |
          set -eu
          cd apps/desktop
          npx --no-install tauri ios init --ci --config "{\"identifier\":\"$BUNDLE_ID\"}"
          node prepare-ios.mjs

      - name: 归档
        run: |
          set -eu
          cd apps/desktop
          # 不用 `--build-number`：它把参数追加在 app version 后面，0.3.26111301 会变成
          # CFBundleVersion 0.3.26111301.26111301（21 字符），TestFlight 以 90059 拒绝
          # （CFBundleVersion 上限 18 字符）。这里直接用 bundle.iOS.bundleVersion 把
          # CFBundleVersion 钉成 YYMMDDNN，与安卓 versionCode 同量纲。
          config="{\"identifier\":\"$BUNDLE_ID\",\"version\":\"$MARKETING_VERSION\",\"bundle\":{\"iOS\":{\"bundleVersion\":\"$BUILD_NUMBER\"}}}"
          npx --no-install tauri ios build --target aarch64 --archive-only --config "$config"
          archive="$(find "$PWD/src-tauri/gen/apple/build" -maxdepth 1 -name '*.xcarchive' | head -1)"
          [ -n "$archive" ] || { echo "::error::no xcarchive was produced"; exit 1; }
          app="$(find "$archive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$app" ] || { echo "::error::no app was archived"; exit 1; }
          [ "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$app/Info.plist")" = false ] || {
            echo "::error::archived app is missing the export compliance declaration"; exit 1
          }
          # 绝对路径：后面的导出步骤在仓库根目录跑，相对 apps/desktop 的路径会失效。
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          # 上传前就把上传会用到的值打出来，失败时不必再猜 Info.plist 里是什么。
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' \
            "$archive/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' \
            "$archive/Info.plist" 2>/dev/null || true

      # tauri 生成的 ExportOptions 不带 provisioningProfiles，导出会失败；这里写一份完整的。
      - name: 导出 IPA
        env:
          TESTFLIGHT_INTERNAL: ${{ inputs.testflight_internal }}
        run: |
          set -eu
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>iPhone Distribution</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key>
            <dict/>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $IOS_PROFILE_NAME" \
            "$RUNNER_TEMP/ExportOptions.plist"
          if [ "${TESTFLIGHT_INTERNAL:-false}" = true ]; then
            plutil -insert testFlightInternalTestingOnly -bool true "$RUNNER_TEMP/ExportOptions.plist"
          fi
          mkdir -p dist-ios
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportPath "$PWD/dist-ios" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ipa="$(find dist-ios -name '*.ipa' | head -1)"
          [ -n "$ipa" ] || { echo "::error::no IPA was exported"; exit 1; }
          mv "$ipa" dist-ios/yonder-ios.ipa
          check="$RUNNER_TEMP/yonder-ios-verify"
          unzip -q dist-ios/yonder-ios.ipa -d "$check"
          app="$(find "$check/Payload" -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$app" ] || { echo "::error::no app in exported IPA"; exit 1; }
          codesign -d --entitlements - --xml "$app" > "$check/entitlements.plist"
          expect_value() {
            [ "$(plutil -extract "$2" raw "$1" 2>/dev/null)" = "$3" ] || {
              echo "::error::exported IPA has missing or invalid $2"
              exit 1
            }
          }
          expect_value "$app/Info.plist" CFBundleIdentifier "$BUNDLE_ID"
          expect_value "$app/Info.plist" YonderPushEnvironment production
          expect_value "$check/entitlements.plist" aps-environment production
          expect_value "$check/entitlements.plist" application-identifier "$TEAM_ID.$BUNDLE_ID"
          expect_value "$check/entitlements.plist" 'com\.apple\.developer\.team-identifier' "$TEAM_ID"
          expect_value "$app/Info.plist" CFBundleShortVersionString "$MARKETING_VERSION"
          expect_value "$app/Info.plist" CFBundleVersion "$BUILD_NUMBER"
          if [ "${TESTFLIGHT_XCODE_27_2:-false}" = true ]; then
            expect_value "$app/Info.plist" DTSDKName iphoneos27.2
            expect_value "$app/Info.plist" DTXcodeBuild 27B52
            echo "Verified exported control IPA uses Xcode 27.2 (27B52) and iPhoneOS SDK 27.2"
          fi
          ls -l dist-ios/yonder-ios.ipa

      - name: 上传 TestFlight
        env:
          KEY_BASE64: ${{ secrets[inputs.ios_app == 'next' && 'ASC_IOS_NEXT_API_PRIVATE_KEY_BASE64' || 'ASC_API_PRIVATE_KEY_BASE64'] }}
          KEY_ID: ${{ secrets[inputs.ios_app == 'next' && 'ASC_IOS_NEXT_API_KEY_ID' || 'ASC_API_KEY_ID'] }}
          ISSUER_ID: ${{ secrets[inputs.ios_app == 'next' && 'ASC_IOS_NEXT_API_ISSUER_ID' || 'ASC_API_ISSUER_ID'] }}
        run: |
          set -eu
          [ -n "${KEY_BASE64:-}" ] || { echo "::error::missing App Store Connect private key for $BUNDLE_ID"; exit 1; }
          [ -n "${KEY_ID:-}" ] || { echo "::error::missing App Store Connect key ID for $BUNDLE_ID"; exit 1; }
          [ -n "${ISSUER_ID:-}" ] || { echo "::error::missing App Store Connect issuer ID for $BUNDLE_ID"; exit 1; }
          # altool 只在自己固定的几处目录里找 AuthKey_<id>.p8，--api-key-path 给目录也要是它认得的那种；
          # 本地实测把它放到 ~/.appstoreconnect/private_keys 最稳（--api-key-path 传文件本身仍然报 -43）。
          keydir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keydir"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$keydir/AuthKey_$KEY_ID.p8"
          chmod 600 "$keydir/AuthKey_$KEY_ID.p8"
          xcrun altool --upload-app -f dist-ios/yonder-ios.ipa -t ios \
            --api-key "$KEY_ID" --api-issuer "$ISSUER_ID"

      # Apple 处理完成后，核对内部测试组和构建的实际内测状态。
      - name: 交给内部测试组并确认可以测试
        env:
          KEY_BASE64: ${{ secrets[inputs.ios_app == 'next' && 'ASC_IOS_NEXT_API_PRIVATE_KEY_BASE64' || 'ASC_API_PRIVATE_KEY_BASE64'] }}
          KEY_ID: ${{ secrets[inputs.ios_app == 'next' && 'ASC_IOS_NEXT_API_KEY_ID' || 'ASC_API_KEY_ID'] }}
          ISSUER_ID: ${{ secrets[inputs.ios_app == 'next' && 'ASC_IOS_NEXT_API_ISSUER_ID' || 'ASC_API_ISSUER_ID'] }}
        run: |
          set -eu
          keydir="$RUNNER_TEMP/asc"
          mkdir -p "$keydir"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$keydir/AuthKey_$KEY_ID.p8"
          chmod 600 "$keydir/AuthKey_$KEY_ID.p8"
          KEY_PATH="$keydir/AuthKey_$KEY_ID.p8" BUILD_NUMBER="$BUILD_NUMBER" \
            node scripts/release/testflight-ready.mjs

      - name: 上传 GitHub Release 资产
        if: ${{ !inputs.testflight_internal && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist-ios/yonder-ios.ipa --clobber

      - name: 清理签名材料
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/yonder-signing" "$RUNNER_TEMP/yonder-ios-verify" "$RUNNER_TEMP/asc" "$RUNNER_TEMP/ExportOptions.plist" "$HOME/.appstoreconnect"
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
          rm -f apps/desktop/src-tauri/gen/apple/.icon-opaque.png
