# 桌面应用产物：正式 Release 发布后构建 macOS dmg 与 Windows nsis，追加到同一个 GitHub Release，
# 并上传 OSS desktop/<version>/。
#
# 触发：本仓 Release 由 release.yml 用 GITHUB_TOKEN 创建，GITHUB_TOKEN 产生的 Release 不会再触发
# 其他 workflow，所以实际入口是 release.yml 在公开 Release 之后显式派发本 workflow。
# 下面的 release: published 只是对外部手动发布的兜底，本仓不会由它触发。
#
# 版本不从仓库文件读：release.yml 已经用 sync-desktop-version.mjs 把版本写进 apps/desktop 的三个
# 清单，构建时仍用 `tauri build --config '{"version":…}'` 再钉一次，产物名与 tag 一致。
#
# 产物命名（Tauri 2 默认）：
#   macOS   Yonder_<version>_aarch64.dmg
#   Windows Yonder_<version>_x64-setup.exe
name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z) to build desktop bundles for
        required: true
        type: string
      expected_commit:
        description: Full 40-character commit SHA of the release tag
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

# 串行推进各平台清单；重跑会覆盖同名产物。
concurrency:
  # Different release versions must not race while advancing the static manifests.
  group: desktop-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version and commit
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.target.outputs.version }}
      commit: ${{ steps.target.outputs.commit }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin release version and commit
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version || github.event.release.tag_name }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version: $version"; exit 1; }
          tag="v$version"
          actual="$(gh api "repos/{owner}/{repo}/commits/$tag" --jq .sha)"
          [[ "$actual" =~ ^[0-9a-f]{40}$ ]] || { echo "Cannot resolve $tag: $actual"; exit 1; }
          if [ -n "$EXPECTED_COMMIT" ] && [ "$actual" != "$EXPECTED_COMMIT" ]; then
            echo "Tag $tag points at $actual, not $EXPECTED_COMMIT"; exit 1
          fi
          # 只给已发布的正式 Release 出桌面包；草稿与预发布都不构建。
          state="$(gh release view "$tag" --json isDraft,isPrerelease --jq \
            'if .isDraft or .isPrerelease then "unstable" else "stable" end')"
          [ "$state" = "stable" ] || { echo "Release $tag is not a published stable release"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$actual" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS dmg
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          # 显式指定目标：不依赖 macos-latest 当时是 Intel 还是 Apple Silicon runner，
          # 产物名固定为 aarch64。
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install workspace dependencies
        run: npm ci
      - name: Build the web bundle the shell embeds
        run: npm run build
      - name: Install Tauri CLI
        run: npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node scripts/release/tauri-updater-config.mjs --version "$VERSION" --output "$RUNNER_TEMP/yonder-updater-config.json"
      - name: Configure macOS signing
        id: signing
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_BASE64" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$SIGNING_IDENTITY" ]; then
            echo '::warning::macOS Developer ID secrets are incomplete; building ad-hoc without notarization'
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_BASE64" ]; then
            echo '::error::App Store Connect API secrets are required for macOS notarization'
            exit 1
          fi
          dir="$RUNNER_TEMP/yonder-macos-signing"
          mkdir -p "$dir"
          chmod 700 "$dir"
          keychain="$dir/yonder.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERT_BASE64" | base64 --decode > "$dir/developer-id.p12"
          security import "$dir/developer-id.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$dir/AuthKey.p8"
          chmod 600 "$dir/AuthKey.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_API_KEY=$ASC_KEY_ID"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID"
            echo "APPLE_API_KEY_PATH=$dir/AuthKey.p8"
          } >> "$GITHUB_ENV"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Build dmg
        # Tauri notarizes and staples the app before including it in the dmg.
        working-directory: apps/desktop
        run: >-
          npx --no-install tauri build
          --target aarch64-apple-darwin
          --config "$RUNNER_TEMP/yonder-updater-config.json"
          --bundles app,dmg
      - name: Notarize dmg
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          dmg="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Yonder_${VERSION}_aarch64.dmg"
          # Tauri signs the dmg but only submits the app for notarization.
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$RUNNER_TEMP/yonder-macos-notary.json"
          node -e 'const r = require(process.argv[1]); console.log(`DMG notarization: ${r.status}`); if (r.status !== "Accepted") process.exit(1)' \
            "$RUNNER_TEMP/yonder-macos-notary.json"
          xcrun stapler staple "$dmg"
      - name: Collect artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          # 文件名由 Tauri 按 productName/version/arch 生成；到这里架构是固定的。
          name="Yonder_${VERSION}_aarch64.dmg"
          bundle="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          test -f "$bundle/dmg/$name"
          codesign --verify --deep --strict "$bundle/macos/Yonder.app"
          if [ "${{ steps.signing.outputs.enabled }}" = true ]; then
            dmg="$bundle/dmg/$name"
            codesign --verify --deep --strict "$dmg"
            # The install policy is for packages; Gatekeeper assesses disk images with the open policy.
            spctl -a -vv -t install "$dmg" || echo '::warning::install policy did not accept the dmg; checking disk-image open policy'
            spctl -a -vv -t open --context context:primary-signature "$dmg"
            xcrun stapler validate "$dmg"
            mountpoint="$RUNNER_TEMP/yonder-macos-mounted"
            mkdir -p "$mountpoint"
            hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$dmg"
            trap 'hdiutil detach "$mountpoint" >/dev/null || true' EXIT
            app="$mountpoint/Yonder.app"
            codesign --verify --deep --strict "$app"
            spctl -a -vv "$app"
            xcrun stapler validate "$app"
          fi
          mkdir -p dist && cp "$bundle/dmg/$name" "dist/$name"
          # Archive the same signed app Tauri put in the dmg; it is notarized when Apple secrets are configured.
          tar -czf dist/Yonder.app.tar.gz -C "$bundle/macos" Yonder.app
          echo "file=$name" >> "$GITHUB_OUTPUT"
      - name: Sign updater archive
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || { echo '::error::Updater signing secrets are required'; exit 1; }
          npx --no-install tauri signer sign ../../dist/Yonder.app.tar.gz --app-version "$VERSION"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.resolve.outputs.tag }}" "dist/${{ steps.artifact.outputs.file }}" --clobber
      - name: Upload to OSS
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: >-
          node scripts/release/oss.mjs --put
          --key "desktop/${{ needs.resolve.outputs.version }}/${{ steps.artifact.outputs.file }}"
          --file "dist/${{ steps.artifact.outputs.file }}"
      - name: Publish updater archive and manifest
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: >-
          node scripts/release/desktop.mjs --version "$VERSION" --target darwin-aarch64
          --artifact dist/Yonder.app.tar.gz --signature dist/Yonder.app.tar.gz.sig
      - name: Remove macOS signing materials
        if: ${{ always() }}
        run: |
          keychain="$RUNNER_TEMP/yonder-macos-signing/yonder.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain" || echo '::warning::Could not delete the temporary keychain'
          fi
          rm -rf "$RUNNER_TEMP/yonder-macos-signing" "$RUNNER_TEMP/yonder-macos-notary.json"

  windows:
    name: Windows nsis
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install workspace dependencies
        run: npm ci
      - name: Build the web bundle the shell embeds
        run: npm run build
      - name: Install Tauri CLI
        run: npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Inject updater public key
        shell: pwsh
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node scripts/release/tauri-updater-config.mjs --version $env:VERSION --output "$env:RUNNER_TEMP/yonder-updater-config.json"
      - name: Build nsis installer (unsigned)
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npx --no-install tauri build --config "$env:RUNNER_TEMP/yonder-updater-config.json" --bundles nsis
      - name: Collect artifact
        id: artifact
        shell: pwsh
        run: |
          $name = "Yonder_$($env:VERSION)_x64-setup.exe"
          $src = "apps/desktop/src-tauri/target/release/bundle/nsis/$name"
          if (-not (Test-Path $src)) { throw "missing $src" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $src "dist/$name"
          "file=$name" >> $env:GITHUB_OUTPUT
      - name: Sign updater installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw 'Updater signing secrets are required' }
          npx --no-install tauri signer sign "../../dist/Yonder_$($env:VERSION)_x64-setup.exe" --app-version $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.resolve.outputs.tag }}" "dist/${{ steps.artifact.outputs.file }}" --clobber
      - name: Publish updater installer and manifest
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: >-
          node scripts/release/desktop.mjs --version "$VERSION" --target windows-x86_64
          --artifact "dist/${{ steps.artifact.outputs.file }}" --signature "dist/${{ steps.artifact.outputs.file }}.sig"
