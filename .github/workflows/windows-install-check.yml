# Windows 安装验证：安装正式版或指定的草稿候选包，启动、截图，再卸载。
#
# 本仓没有 Windows 机器，`desktop-release.yml` 只证明「能构建出安装包」，不证明「装得上、起得来」。
# 在 x64 或 ARM64 runner 上静默安装 x64 包，确认主窗口和进程存活 20 秒，再截图卸载。
#
# 候选模式需要同时提供草稿附件 ID 和 SHA256。
# 产物名与 desktop-release.yml 的 Collect artifact 步骤一致：Yonder_<version>_x64-setup.exe。
#
# 签名包安装前验证安装器，安装后验证主程序和卸载器；SmartScreen 仍需单独验证。
name: Windows install check

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要验证的 Release tag，例如 v0.3.26111301
        required: true
        type: string
      runner:
        description: Windows runner
        type: choice
        default: windows-2025
        options:
          - windows-2025
          - windows-11-arm
      candidate_asset_id:
        description: 草稿候选安装包的附件 ID
        type: string
      candidate_sha256:
        description: 草稿候选安装包的 SHA256
        type: string
      require_authenticode:
        description: 要求安装器、主程序及卸载器均有有效的 Authenticode 签名
        type: boolean
        default: false
      expected_signer_thumbprint:
        description: 预期的签名证书指纹，留空使用仓库当前签名证书
        type: string

permissions:
  contents: write # 仅用于下载非公开 Release 草稿附件

concurrency:
  group: windows-install-check-${{ inputs.tag }}-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  install:
    name: Install, launch and uninstall on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner == 'windows-11-arm' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 20
    env:
      RUNNER_LABEL: ${{ inputs.runner }}
    steps:
      - name: 检查 runner 的系统架构
        id: platform
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          "architecture=$architecture" >> $env:GITHUB_OUTPUT
          Write-Host "runner=$env:RUNNER_LABEL OSArchitecture=$architecture"
          $expected = if ($env:RUNNER_LABEL -eq 'windows-11-arm') { 'Arm64' } else { 'X64' }
          if ($architecture -ne $expected) { throw "系统架构应为 $expected，实际为 $architecture" }

      - name: 解析并下载安装包
        id: download
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          CANDIDATE_ASSET_ID: ${{ inputs.candidate_asset_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          REQUIRE_AUTHENTICODE: ${{ inputs.require_authenticode || vars.DESKTOP_REQUIRE_OS_CODE_SIGNING == 'true' || inputs.expected_signer_thumbprint != '' }}
          EXPECTED_SIGNER_THUMBPRINT: ${{ inputs.expected_signer_thumbprint || vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -cnotmatch '\Av0\.[0-9]+\.[0-9]{8}\z') {
            throw 'tag 必须是 v0.<minor>.<YYMMDDNN>，且只使用 ASCII 数字'
          }
          "tag=$env:TAG" >> $env:GITHUB_OUTPUT
          $candidate = $env:CANDIDATE_ASSET_ID -or $env:CANDIDATE_SHA256
          if ($candidate -and ($env:CANDIDATE_ASSET_ID -notmatch '\A[1-9][0-9]*\z' -or
              $env:CANDIDATE_SHA256 -notmatch '\A[0-9A-Fa-f]{64}\z')) {
            throw '候选模式必须同时提供正整数 candidate_asset_id 和 64 位十六进制 candidate_sha256'
          }

          $version = $env:TAG.Substring(1)
          $name = "Yonder_${version}_x64-setup.exe"
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $file = Join-Path dist $name
          if ($candidate) {
            if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw '候选包二进制下载需要 PowerShell 7.4+' }
            $query = '.[] | select(.draft) | .assets[] | select((.id | tostring) == "{0}" and .name == "{1}") | .size' -f $env:CANDIDATE_ASSET_ID, $name
            $size = gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq $query
            if ($LASTEXITCODE -ne 0 -or $null -eq $size) {
              throw "无法在 $env:GH_REPO 的 Release 草稿中读取附件 $env:CANDIDATE_ASSET_ID ($name)。请核对附件 ID、文件名及 GITHUB_TOKEN 的草稿读取权限。"
            }
            gh api -H 'Accept: application/octet-stream' "repos/$env:GH_REPO/releases/assets/$env:CANDIDATE_ASSET_ID" > $file
            if ($LASTEXITCODE -ne 0) { throw '下载草稿候选附件失败，请核对 GITHUB_TOKEN 的附件读取权限' }
          } else {
            $releaseJson = gh release view $env:TAG --json isDraft,isPrerelease,assets
            if ($LASTEXITCODE -ne 0) { throw "无法读取 Release $env:TAG" }
            $release = $releaseJson | ConvertFrom-Json
            if ($release.isDraft -or $release.isPrerelease) { throw "$env:TAG 不是已发布的正式版" }
            $asset = $release.assets | Where-Object { $_.name -ceq $name }
            if (-not $asset) { throw "Release $env:TAG 里没有 $name" }
            $size = $asset.size
            gh release download $env:TAG --pattern $name --dir dist
            if ($LASTEXITCODE -ne 0) { throw "下载正式版安装包 $name 失败" }
          }
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "下载后找不到 $file" }
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "安装包 $name（Release 记录 $size 字节）sha256=$hash"
          if ($candidate -and $hash -ine $env:CANDIDATE_SHA256) { throw '候选安装包的 SHA256 与输入不匹配' }
          $expectedSigner = ($env:EXPECTED_SIGNER_THUMBPRINT ?? '').Trim()
          if ($expectedSigner -and $expectedSigner -notmatch '\A[0-9A-Fa-f]{40}\z') {
            throw '预期的签名证书指纹必须是 40 位十六进制'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $file
          if ($signature.Status -eq 'NotSigned' -and $env:REQUIRE_AUTHENTICODE -ne 'true') {
            Write-Host '::warning::开发安装包没有 Authenticode 签名'
          } else {
            if ($signature.Status -ne 'Valid' -or $signature.SignatureType -ne 'Authenticode' -or
                -not $signature.TimeStamperCertificate) {
              throw "安装包缺少有效的带时间戳 Authenticode 签名 ($($signature.Status))"
            }
            if ($expectedSigner -and $signature.SignerCertificate.Thumbprint -ne $expectedSigner) {
              throw '安装包签名证书指纹与预期不符'
            }
            "signer_thumbprint=$($signature.SignerCertificate.Thumbprint)" >> $env:GITHUB_OUTPUT
            Write-Host "安装包签名已验证 ($($signature.SignerCertificate.Subject))"
          }

      # Tauri 的 nsis 安装包默认 installMode=currentUser，`/S` 是它的静默开关。
      - name: 静默安装
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PWD "dist/$env:NAME"
          if (-not (Test-Path $installer)) { throw "找不到安装包 $installer" }
          Write-Host "运行 $installer /S"
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "安装程序退出码 $($process.ExitCode)" }
        env:
          NAME: ${{ steps.download.outputs.name }}

      - name: 找到安装后的可执行文件
        id: app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @(
            @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}) |
              Where-Object { $_ } | ForEach-Object { Join-Path $_ 'Yonder' } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Container }
          )
          if ($roots.Count -eq 0) { throw '安装后找不到 Yonder 目录（找过 LOCALAPPDATA / ProgramFiles / ProgramFiles(x86)）' }
          # 可执行文件名来自 Cargo 包名（apps/desktop/src-tauri/Cargo.toml 的 name），
          # 不是 productName；先按 tauri.conf.json 的 mainBinaryName 找，找不到再退回目录里唯一的 exe。
          $candidates = @('Yonder.exe', 'yonder-desktop.exe', 'yonder_desktop.exe')
          $exe = $null
          foreach ($name in $candidates) {
            $exe = Get-ChildItem -LiteralPath $roots -Filter $name -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { break }
          }
          if (-not $exe) {
            $exe = Get-ChildItem -LiteralPath $roots -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ne 'uninstall.exe' } | Select-Object -First 1
          }
          if (-not $exe) {
            "dir=$($roots[0])" >> $env:GITHUB_OUTPUT
            $listing = Get-ChildItem -LiteralPath $roots -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 -ExpandProperty FullName
            throw "在 $($roots -join ', ') 下找不到应用 exe；目录内容：$($listing -join ' | ')"
          }
          "dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT
          if ($env:SIGNER_THUMBPRINT) {
            foreach ($file in @($exe.FullName, (Join-Path $exe.DirectoryName 'uninstall.exe'))) {
              $signature = Get-AuthenticodeSignature -LiteralPath $file
              if ($signature.Status -ne 'Valid' -or $signature.SignatureType -ne 'Authenticode' -or
                  $signature.SignerCertificate.Thumbprint -ne $env:SIGNER_THUMBPRINT -or -not $signature.TimeStamperCertificate) {
                throw "主程序或卸载器缺少与安装包一致的带时间戳签名 ($file, $($signature.Status))"
              }
            }
            'installed_signatures_verified=true' >> $env:GITHUB_OUTPUT
          }
          $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($exe.FullName))
          try {
            if ($reader.BaseStream.Length -lt 64 -or $reader.ReadUInt16() -ne 0x5A4D) {
              throw '应用 exe 缺少有效的 MZ 文件头'
            }
            $reader.BaseStream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            if ($peOffset -lt 64 -or $peOffset -gt ($reader.BaseStream.Length - 6)) {
              throw '应用 exe 的 PE 文件头偏移越界'
            }
            $reader.BaseStream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) { throw '应用 exe 缺少有效的 PE 签名' }
            $machine = '0x{0:X4}' -f $reader.ReadUInt16()
            "machine=$machine" >> $env:GITHUB_OUTPUT
            if ($machine -ne '0x8664') { throw "应用 exe 的 Machine 为 $machine，预期 x64 (0x8664)" }
          } finally {
            $reader.Dispose()
          }
          $fileVersion = $exe.VersionInfo.FileVersion
          Write-Host "exe=$($exe.FullName) FileVersion=$fileVersion Machine=$machine"
          # Tauri 把版本写进 FileVersion；有的工具链会补成四段（0.3.x.0），所以只比前缀。
          if ($fileVersion -and -not $fileVersion.StartsWith($env:VERSION)) {
            throw "安装出来的 exe 版本是 $fileVersion，Release 是 $env:VERSION"
          }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
        env:
          VERSION: ${{ steps.download.outputs.version }}
          SIGNER_THUMBPRINT: ${{ steps.download.outputs.signer_thumbprint }}

      # 进程能起来并且 20 秒不退出，才算安装成功；启动即崩的包在这个检查里会掉出来。
      - name: 启动并确认进程存活 20 秒
        id: launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process -FilePath $env:EXE -PassThru
          "pid=$($process.Id)" >> $env:GITHUB_OUTPUT
          Write-Host "已启动 pid=$($process.Id)"
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
            if ($process.HasExited) {
              throw "应用在 $([int](20 - ($deadline - (Get-Date)).TotalSeconds)) 秒内退出，退出码 $($process.ExitCode)"
            }
          }
          $process.Refresh()
          $handle = $process.MainWindowHandle.ToInt64()
          if ($process.HasExited -or $handle -eq 0) { throw '20 秒后应用已退出或没有主窗口' }
          "window_handle=$handle" >> $env:GITHUB_OUTPUT
          Write-Host "20 秒后仍在运行，主窗口句柄 $handle"
        env:
          EXE: ${{ steps.app.outputs.path }}

      - name: 截图
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $signature = @'
          [StructLayout(LayoutKind.Sequential)]
          public struct RECT
          {
              public int Left;
              public int Top;
              public int Right;
              public int Bottom;
          }
          [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
          [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr hWnd, IntPtr hdc, uint flags);
          '@
          Add-Type -MemberDefinition $signature -Name Win32 -Namespace Shell
          $process = Get-Process -Id $env:APP_PID -ErrorAction Stop
          $handle = $process.MainWindowHandle
          if ($handle -eq [IntPtr]::Zero) {
            throw "进程 $env:APP_PID 没有主窗口句柄"
          }

          $bounds = [Shell.Win32+RECT]::new()
          if (-not ([Shell.Win32]::GetWindowRect($handle, [ref]$bounds))) {
            throw "GetWindowRect 无法获取进程 $env:APP_PID 的主窗口尺寸"
          }
          $width = $bounds.Right - $bounds.Left
          $height = $bounds.Bottom - $bounds.Top
          if ($width -le 0 -or $height -le 0) {
            throw "主窗口尺寸无效：${width}x${height}"
          }

          $bitmap = [System.Drawing.Bitmap]::new($width, $height, [System.Drawing.Imaging.PixelFormat]::Format24bppRgb)
          try {
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $hdc = $graphics.GetHdc()
              try {
                $PW_RENDERFULLCONTENT = 2
                if (-not ([Shell.Win32]::PrintWindow($handle, $hdc, $PW_RENDERFULLCONTENT))) {
                  throw "PrintWindow 无法捕获进程 $env:APP_PID 的主窗口"
                }
              } finally {
                $graphics.ReleaseHdc($hdc)
              }
            } finally {
              $graphics.Dispose()
            }

            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            $out = Join-Path $PWD "artifacts/yonder-$env:VERSION-windows.png"
            $bitmap.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)
          } finally {
            $bitmap.Dispose()
          }
          Write-Host "截图 $out（${width}x${height}，$((Get-Item $out).Length) 字节）"
        env:
          APP_PID: ${{ steps.launch.outputs.pid }}
          VERSION: ${{ steps.download.outputs.version }}

      # 截图即使在前面失败也要留下，失败时那张图就是现场。
      - name: 上传截图
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshot-${{ steps.download.outputs.tag }}-${{ inputs.runner }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: 关闭应用
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:APP_PID) {
            Stop-Process -Id $env:APP_PID -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
        env:
          APP_PID: ${{ steps.launch.outputs.pid }}

      - name: 卸载
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = $env:APP_DIR
          if (-not $dir) {
            Write-Host '没有安装目录，跳过卸载'
            exit 0
          }
          if ($env:SIGNER_THUMBPRINT -and $env:INSTALLED_SIGNATURES_VERIFIED -ne 'true') {
            throw '安装后的签名未通过验证，无法运行卸载器'
          }
          $uninstaller = Join-Path $dir 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw "$dir 下没有 uninstall.exe" }
          Write-Host "运行 $uninstaller /S"
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "卸载程序退出码 $($process.ExitCode)" }
          # nsis 卸载是异步的：给进程退出和目录清理留出时间，再确认目录已经消失。
          for ($i = 0; $i -lt 30; $i++) {
            if (-not (Test-Path -LiteralPath $dir)) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $dir) { throw "卸载后 $dir 仍然存在" }
          Write-Host '卸载完成，安装目录已移除'
        env:
          APP_DIR: ${{ steps.app.outputs.dir }}
          SIGNER_THUMBPRINT: ${{ steps.download.outputs.signer_thumbprint }}
          INSTALLED_SIGNATURES_VERIFIED: ${{ steps.app.outputs.installed_signatures_verified }}

      - name: 写检查结果
        if: ${{ always() }}
        shell: pwsh
        env:
          TAG: ${{ steps.download.outputs.tag }}
          NAME: ${{ steps.download.outputs.name }}
          SHA256: ${{ steps.download.outputs.sha256 }}
          SIGNER_THUMBPRINT: ${{ steps.download.outputs.signer_thumbprint }}
          OS_ARCHITECTURE: ${{ steps.platform.outputs.architecture }}
          APP_DIR: ${{ steps.app.outputs.dir }}
          APP_MACHINE: ${{ steps.app.outputs.machine }}
          WINDOW_HANDLE: ${{ steps.launch.outputs.window_handle }}
          RESULT: ${{ job.status }}
        run: |
          @(
            '### Windows 安装检查'
            ''
            "- tag：$env:TAG"
            "- Runner：$env:RUNNER_LABEL"
            "- OSArchitecture：$env:OS_ARCHITECTURE"
            "- 安装包：$env:NAME"
            "- 下载摘要：$env:SHA256"
            "- 发布者证书指纹：$env:SIGNER_THUMBPRINT"
            "- 安装路径：$env:APP_DIR"
            "- 应用 PE Machine：$env:APP_MACHINE"
            "- 主窗口句柄：$env:WINDOW_HANDLE"
            "- 结果：$env:RESULT"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
