name: Bug report
description: Something in the shell does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, API keys, phone numbers, tokens or private user data in an issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version shown in the app, or the `version` field of `GET /api/version`
      placeholder: 0.3.26111201
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/web (page)
        - apps/desktop (Tauri shell)
        - packages/protocol
        - CI / release
        - Documentation
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and version, plus Node version for anything outside the desktop app
      placeholder: macOS 27.2, Node 22.19.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output only. Remove credentials and personal data.
      render: text
