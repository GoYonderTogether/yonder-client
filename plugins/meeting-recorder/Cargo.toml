[package]
name = "tauri-plugin-meeting-recorder"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-meeting-recorder"

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
cpal = "=0.16.0"
tauri = { version = "=2.12.5", features = ["tray-icon"] }

[build-dependencies]
tauri-plugin = { version = "=2.7.2", features = ["build"] }
