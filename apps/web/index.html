<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="Content-Security-Policy" content="frame-src 'self' https://open.weixin.qq.com https://yonderbot.net/v1/auth/wechat/web/callback https://yonder.zethai.cn/v1/auth/wechat/web/callback" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="description" content="" />
		<meta property="og:title" content="Yonder" />
		<meta property="og:description" content="" />
		<meta property="og:image" content="https://yonder.zethai.cn/icon-512.png" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<title>Yonder</title>
<script>
			// First paint: read the stored theme and language and set them before any CSS runs, so the
			// page never flashes the wrong one (02-视觉样式 第十二节). Keep this short and dependency-free.
			try {
				const storedTheme = localStorage.getItem("yonder.theme");
				const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
				document.documentElement.dataset.theme =
					storedTheme === "light" || storedTheme === "dark" ? storedTheme : prefersDark ? "dark" : "light";
				document.documentElement.dataset.style = localStorage.getItem("yonder.style") === "glow" ? "glow" : "classic";
				// 通用 · 界面大小. `medium` is the default `tokens.css` already assumes, so an unset or
				// unknown value needs no attribute; the five levels are the ones the settings page offers.
				const storedSize = localStorage.getItem("yonder.ui-size");
				document.documentElement.dataset.uiSize = ["xsmall", "small", "medium", "large", "xlarge"].includes(
					storedSize,
				)
					? storedSize
					: "medium";
				const storedLocale = localStorage.getItem("yonder.locale");
				document.documentElement.lang =
					storedLocale === "zh-CN" || storedLocale === "en"
						? storedLocale
						: /^zh\b|^zh-/i.test(navigator.language || "en")
							? "zh-CN"
							: "en";
				document.documentElement.dataset.density = window.innerWidth >= 900 ? "comfortable" : "compact";
			} catch {
				// A locked storage must not stop the app from rendering.
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
