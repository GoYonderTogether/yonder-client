<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="description" content="" />
		<meta property="og:title" content="Yonder" />
		<meta property="og:description" content="" />
		<meta property="og:image" content="https://yonder.zethai.cn/icon-512.png" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<title>Yonder</title>
<script>
			// First paint: read the stored theme and language and set them before any CSS runs, so the
			// page never flashes the wrong one (02-视觉样式 第十二节). Keep this short and dependency-free.
			try {
				const storedTheme = localStorage.getItem("yonder.theme");
				const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
				document.documentElement.dataset.theme =
					storedTheme === "light" || storedTheme === "dark" ? storedTheme : prefersDark ? "dark" : "light";
				const storedLocale = localStorage.getItem("yonder.locale");
				document.documentElement.lang =
					storedLocale === "zh-CN" || storedLocale === "en"
						? storedLocale
						: /^zh\b|^zh-/i.test(navigator.language || "en")
							? "zh-CN"
							: "en";
				document.documentElement.dataset.density = window.innerWidth >= 900 ? "comfortable" : "compact";
			} catch {
				// A locked storage must not stop the app from rendering.
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
