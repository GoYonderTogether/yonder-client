[package]
name = "yonder-desktop"
version = "0.3.26112803"
edition = "2021"

# Desktop builds the binary from src/main.rs; mobile builds only the library.
[lib]
name = "yonder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "=1.10.0"
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
# `generate_context!` emits serde_json paths when plugin configuration is present.
serde_json = "=1.0.145"
serde = { version = "=1.0.229", features = ["derive"] }
tauri-plugin-meeting-recorder = { path = "../../../plugins/meeting-recorder" }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-clipboard-manager = "=2.5.0"

# Taps, the keyboard rising and recording play the system haptics (apps/web/src/lib/haptics.ts).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "=2.4.2"

# Desktop session and local-model secrets use the platform credential store, with the same
# keyring backends previously used by the Tauri keyring plugin.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-notification = "=2.8.0"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.14.1"
sha2 = "=0.10.9"
# The provider relay dials the device-local endpoint (a localhost gateway, an official client's
# proxy) with a blocking client; device-model calls use the async one. reqwest is already in the
# tree through tauri; this pins the same version for direct use.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.54.1", default-features = false, features = ["sync"] }
# File discovery and content search for the local file connectors. Both are ripgrep's own crates:
# `ignore` reads `.gitignore`/`.ignore` (Unlicense OR MIT) and `regex` is the pattern engine
# (MIT OR Apache-2.0). `regex` also brings its syntax crate, so a bad pattern from a model is a
# reported `invalid_pattern`, never a panic.
libc = "0.2"
ignore = "=0.4.33"
regex = "=1.13.1"

[target.'cfg(windows)'.dependencies]
cap-primitives = "=4.0.3"
cap-fs-ext = "=4.0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWindow", "NSButton", "NSView"] }

[target.'cfg(target_os = "ios")'.dependencies]
sha2 = "=0.10.9"

# Windows job objects: a command's whole tree is terminated with `kill` (TOOLS-V3 §4). `Win32_UI_Shell`
# / `Win32_UI_WindowsAndMessaging` give administrator execution its `ShellExecuteExW` + `runas` UAC
# prompt (supplement §2); `Win32_System_Registry` and `Win32_Security` are the features those symbols
# are gated behind in windows-sys 0.61. The crate is the one Tauri already pulls in through
# `tauri-utils`/WebView2, pinned to the same major version.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.61.2"
features = [
	"Win32_Foundation",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_System_Registry",
	"Win32_Security",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
]
