[package]
name = "yonder-desktop"
version = "0.3.26111701"
edition = "2021"

# Desktop builds the binary from src/main.rs; mobile builds only the library.
[lib]
name = "yonder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
# `generate_context!` emits serde_json paths when plugin configuration is present.
serde_json = "=1.0.145"
serde = { version = "=1.0.229", features = ["derive"] }
tauri-plugin-meeting-recorder = { path = "../../../plugins/meeting-recorder" }

# The refresh token lives in the OS credential store: Keychain on macOS, Credential Manager on
# Windows, libsecret on Linux. The webview never persists it (10-质量 第四节). The plugin has no
# iOS or Android implementation and does not compile there, so it is a desktop-only dependency.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-keyring = "=0.1.0"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.14.1"
# Native message box for the local-file grant confirmation, shown by Rust only.
#
# `rfd` directly rather than `tauri-plugin-dialog`: the plugin installs an init script that
# replaces `window.confirm` with a Promise, which is always truthy, and the interface relies on
# `window.confirm` being synchronous at five destructive sites (discard a provider draft, delete a
# provider, delete a skill, reload after a chunk error). `rfd` is the same native backend the plugin
# wraps, without that script.
#
# Features mirror what the plugin selects: GTK3 on Linux (Tauri already links GTK there), and
# `common-controls-v6` on Windows.
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3", "common-controls-v6"] }
# The confirmation text follows the language the interface picked at start-up, which defaults to
# the system locale (apps/web/index.html reads `navigator.language`).
sys-locale = "=0.3.2"
sha2 = "=0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWindow", "NSButton", "NSView"] }
